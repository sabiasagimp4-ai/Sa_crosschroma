name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reference tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy pillow
          python tools/reference/test_crosschroma.py

      - name: Download latest YMM4 Lite
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/manju-summoner/YukkuriMovieMaker4/releases/latest'
          $asset = $release.assets | Where-Object name -Like '*_Lite.zip' | Select-Object -First 1
          if (-not $asset) { throw 'YMM4 Lite archive was not found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile ymm4.zip
          Expand-Archive ymm4.zip -DestinationPath ymm4-host -Force
          $exe = Get-ChildItem ymm4-host -Recurse -Filter YukkuriMovieMaker.exe | Select-Object -First 1
          if (-not $exe) { throw 'YukkuriMovieMaker.exe was not found' }
          "YMM4_DIR=$($exe.Directory.FullName)\" >> $env:GITHUB_ENV

      - name: Locate fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -Like '*\x64\fxc.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK' }
          "FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          dotnet build .\Sa_CrossChroma.sln -c Release `
            "-p:YMM4DirPath=$env:YMM4_DIR" `
            "-p:FxcPath=$env:FXC_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'YMM4 build failed' }

      - name: Package as .ymme
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'src\Sa_CrossChroma\bin\Release' -Recurse -Filter 'Sa_crosschroma.dll' | Select-Object -First 1
          if (-not $dll) { throw 'The build did not produce Sa_crosschroma.dll' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $dll.FullName 'dist\Sa_crosschroma.dll'
          Compress-Archive -Path 'dist\Sa_crosschroma.dll' -DestinationPath 'Sa_crosschroma.ymme' -Force
          Get-FileHash 'Sa_crosschroma.ymme' -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Sa_crosschroma
          path: Sa_crosschroma.ymme
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [xml]$project = Get-Content 'src\Sa_CrossChroma\Sa_CrossChroma.csproj'
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw 'Project version was not found' }
          $tag = "v$version"

          gh release view $tag --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'Sa_crosschroma.ymme' --repo $env:REPOSITORY --clobber
          } else {
            gh release create $tag 'Sa_crosschroma.ymme' --repo $env:REPOSITORY --target $env:COMMIT_SHA --title "Sa_crosschroma $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }